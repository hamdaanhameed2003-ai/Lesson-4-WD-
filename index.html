<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div id="calculator">
            <div id="result">
                <div id="history">
                    <p id="history-value"></p>
                </div>
                <div id="output">
                    <p id="output-value"></p>
                    <input id="display" type="text" value="" placeholder="0" readonly />
                </div>
            </div>

            <div id="keyboard">
                <button class="operator" id="clear" onclick="backspace()">C</button>
                <button class="operator" id="backspace" onclick="clearall()">CE</button>
                <button class="operator" id="%" onclick="appendValue('%')">%</button>
                <button class="operator" id="/" onclick="appendValue('/')">&#247</button>

                <button class="number" id="7" onclick="appendValue('7')">7</button>
                <button class="number" id="8" onclick="appendValue('8')">8</button>
                <button class="number" id="9" onclick="appendValue('9')">9</button>
                <button class="operator" id="*" onclick="appendValue('*')">&times;</button>

                <button class="number" id="4" onclick="appendValue('4')">4</button>
                <button class="number" id="5" onclick="appendValue('5')">5</button>
                <button class="number" id="6" onclick="appendValue('6')">6</button>
                <button class="operator" id="4" onclick="appendValue('-')">-</button>

                <button class="number" id="1" onclick="appendValue('1')">1</button>
                <button class="number" id="2" onclick="appendValue('2')">2</button>
                <button class="number" id="3" onclick="appendValue('3')">3</button>
                <button class="operator" id="+" onclick="appendValue('+')">+</button>

                <button class="number" id="0" onclick="appendValue('0')">0</button>
                <button class="empty" id="empty" id="empty"></button>
                <button class="empty" id="empty" id="empty"></button>
                <button class="operator" id="=" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="script.js"></script>
</body>

</html>
